<title>Boarding Pass RYR</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f3f5f9}
*{box-sizing:border-box}body{margin:0;padding:28px 16px}
main{max-width:1100px;margin:auto}.intro{margin-bottom:22px}
h1{font-size:clamp(1.5rem,3vw,2.15rem);margin:0 0 8px}
p{color:#536078;line-height:1.5;margin:0}
.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:white;border:1px solid #dce2ec;border-radius:16px;padding:20px;box-shadow:0 8px 25px #1d31500c}
label{display:block;font-weight:650;font-size:.9rem;margin:14px 0 6px}
input{width:100%;border:1px solid #cbd3e1;border-radius:9px;padding:11px 12px;font:inherit;background:#fff}
input:focus{outline:3px solid #dbe7ff;border-color:#2450a4}
.group-title{font-size:1rem;margin:20px 0 0;padding-top:14px;border-top:1px solid #e7ebf2}
button{width:100%;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}
.primary{background:#1b398d;color:#fff}.secondary{background:#edf1f8;color:#1b398d;margin-top:9px}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.preview-head h2{font-size:1.05rem;margin:0}.hint{font-size:.82rem;color:#69758b}
.canvas-wrap{background:#e7eaf0;padding:10px;border-radius:12px;display:flex;justify-content:center}
canvas{display:block;width:100%;height:auto;max-width:540px;border-radius:4px;box-shadow:0 4px 18px #1112}
.note{font-size:.8rem;color:#69758b;margin-top:12px}
select {
    width: 100%;
    border: 1px solid #cbd3e1;
    border-radius: 9px;
    padding: 11px 12px;
    font: inherit;
    background: #fff;
    color: #172033;
}
@media(max-width:780px){.layout{grid-template-columns:1fr}.panel.form{order:1}.preview{order:2}body{padding:18px 12px}}
</style>
</head>
<body>
<main>
  <div class="intro">
    <h1>Boarding Pass STAFF</h1>

  </div>
  <div class="layout">
    <section class="panel form">
      <h2 style="font-size:1.1rem;margin:0">Dati passeggero e tratta</h2>
      <label for="name">Nome e cognome</label>
      <input id="name" autocomplete="name">
     <div class="group-title">Origine</div>
     <label for="originCode">Codice aeroporto (IATA)</label>
        <input id="originCode" name="originCode" type="text" maxlength="3" placeholder="Es. BGY" autocomplete="off" spellcheck="false">
        <label for="originCity">Città</label>
        <input id="originCity" name="originCity" type="text" readonly placeholder="Si compila in automatico">
        <p class="status" id="originStatus" aria-live="polite"></p>
      <div class="group-title">Destinazione</div>
      <label for="destCode">Codice aeroporto (IATA)</label>
        <input id="destCode" name="destCode" type="text" maxlength="3" placeholder="Es. PMO" autocomplete="off" spellcheck="false">
        <label for="destCity">Città</label>
        <input id="destCity" name="destCity" type="text" readonly placeholder="Si compila in automatico">
        <p class="status" id="destStatus" aria-live="polite"></p>
      <div class="group-title">Dettagli del volo</div>
      <label for="reference">Riferimento Biglietto</label>
      <input id="reference" maxlength="6">
      <label for="sequence">Sequenza</label>
      <input id="sequence" type="number" min="1">
      <label for="seat">Numero del posto</label>
      <input id="seat" type="text" value="" maxlength="3" placeholder="Es. 12A">
      <label for="flightNumber">Numero del volo (Senza FR)</label>
      <input id="flightNumber" type="number" value="" maxlength="4">
      <label for="departureTime">Orario di partenza</label>
      <input id="departureTime" type="time" value="" required>
      <label for="flightDate">Data del volo</label>
      <input id="flightDate" type="date" >
            <div class="group-title">Staff Travel</div>
      <label for="staffTitle">Titolo:</label> 
      <select id="staffTitle">  <option value="MR">MR</option> <option value="MRS">MRS</option> </select>
      <label for="staffname">Nome Staff Travel</label>
      <input id="staffname" maxlength="50">
            <label for="staffdate">Data Assunzione</label>
      <input id="staffdate" type="date">
      <label for="walletType">Sticker Wallet</label>

<select id="walletType">
    <option value="apple">Apple Wallet</option>
        <option value="google">Google Wallet</option>
</select>
      <p class="note">La data viene impostata automaticamente a oggi.</p>
<button class="primary" id="generate">Aggiorna anteprima</button>
      <button class="secondary" id="download">Scarica Carta D'Imbarco</button>
    
    </section>
    <section class="panel preview">
      <div class="preview-head"><h2>Anteprima</h2><span class="hint">RYR</span></div>
      <div class="canvas-wrap"><canvas id="canvas" width="1080" height="1910"></canvas></div>
    </section>
  </div>
</main>

const airportByCode = new Map(airports.map(item => [item.code.toUpperCase(), item.city]));

function connectAirport(codeId, cityId, statusId) {
  const codeInput = document.getElementById(codeId);
  const cityInput = document.getElementById(cityId);
  const status = document.getElementById(statusId);

  function updateCity() {
    const code = codeInput.value.trim().toUpperCase();
    codeInput.value = code;
    status.classList.remove('error');

    if (!code) {
      cityInput.value = '';
      status.textContent = '';
      return;
    }

    const city = airportByCode.get(code);
    if (city) {
      cityInput.value = city;
      status.textContent = 'Aeroporto trovato.';
    } else {
      cityInput.value = '';
      status.textContent = code.length < 3
        ? 'Inserisci il codice IATA di 3 lettere.'
        : 'Codice non presente nell’elenco.';
      if (code.length >= 3) status.classList.add('error');
    }
  }

  codeInput.addEventListener('input', updateCity);
  codeInput.addEventListener('blur', updateCity);
}

connectAirport('originCode', 'originCity', 'originStatus');

const BLUE = '#16358c';
const WHITE = '#fff';

function fitText(text, maxWidth, startSize, weight='700'){
  let size=startSize;
  do { ctx.font=`${weight} ${size}px Arial, sans-serif`; if(ctx.measureText(text).width<=maxWidth) break; size-=1; } while(size>12);
  return size;
}
function todayLocalISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(iso){
  const parts = iso.split('-').map(Number);
  if(parts.length !== 3 || !parts[0]) return '';
  const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return `${String(parts[2]).padStart(2,'0')} ${months[parts[1]-1] || ''}`;
}
function subtractMinutes(time, minutes){
  if(!time || !time.includes(':')) return '';
  const [h,m] = time.split(':').map(Number);
  const d = new Date(2000,0,1,h,m-minutes);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function cover(x,y,w,h,color=BLUE){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
let qrImage = null;
let qrTimer = null;

// Genera un posto casuale da 1A a 35F,
// escludendo i posti 1D, 1E e 1F.
function generateSeat() {
    const row = Math.floor(Math.random() * 35) + 1;
    const letters = row === 1 ? 'ABC' : 'ABCDEF';
    const letter = letters.charAt(
        Math.floor(Math.random() * letters.length)
    );

    $('seat').value = `${row}${letter}`;
}

// Genera un riferimento numerico da 1 a 220.
function generateReference() {
    $('sequence').value = Math.floor(Math.random() * 220) + 1;
}

// Genera una sequenza alfanumerica di 6 caratteri,
// garantendo la presenza di almeno un numero.
function generateSequence() {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const chars = letters + numbers;

    // Inserisce obbligatoriamente un numero.
    let sequence = numbers.charAt(
        Math.floor(Math.random() * numbers.length)
    );

    // Aggiunge altri 5 caratteri casuali.
    for (let i = 0; i < 5; i++) {
        sequence += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    // Mescola i caratteri per evitare che il numero
    // sia sempre nella prima posizione.
    sequence = sequence
        .split('')
        .sort(() => Math.random() - 0.5)
        .join('');

    $('reference').value = sequence;
}


window.addEventListener('DOMContentLoaded', () => {
    generateSeat();
    generateReference();
    generateSequence();

    updateQR();
    draw();
});

function updateQR() {
  if (typeof bwipjs === 'undefined') {
    qrImage = null;
    draw();
    return;
  }


  const parts = $('name').value.trim().toUpperCase().split(/\s+/);
const name = parts.length > 1
    ? parts.slice(1).join(' ') + '/' + parts[0]
    : parts[0];
  const reference = $('reference').value.trim().toUpperCase();
  const origin = $('originCode').value.trim().toUpperCase();
  const destination = $('destCode').value.trim().toUpperCase();
  const seat = $('seat').value.trim().toUpperCase();
  const number = $('flightNumber').value.trim().toUpperCase();
  const sequence = $('sequence').value.trim();

  // Payload demo personalizzato.
  const payload = `M1${name}   ${reference} ${origin}${destination}FR ${number} 002Y0${seat} 0${sequence} 149>5181W 6002BFR 00000000000002A0000000000000 0                          NY`;

  // Crea il codice Aztec su un canvas temporaneo.
  const aztecCanvas = document.createElement('canvas');

  try {
    bwipjs.toCanvas(aztecCanvas, {
      bcid: 'azteccode',
      text: payload,
      scale: 5,
      padding: 0,
      backgroundcolor: 'FFFFFF',
      barcolor: '000000'
    });

    // Converte il canvas in un'immagine utilizzabile da draw().
    qrImage = new Image();

    qrImage.onload = function () {
      draw();
    };

    qrImage.onerror = function () {
      qrImage = null;
      draw();
    };

    qrImage.src = aztecCanvas.toDataURL('image/png');

  } catch (error) {
    console.error('Errore nella generazione del codice Aztec:', error);
    qrImage = null;
    draw();
  }
}

let walletSticker = null;

function loadWalletSticker() {
    const selector = document.getElementById("walletType");

    if (!selector) {
        console.error("Menu walletType non trovato.");
        return;
    }

    const stickerUrl = walletStickers[selector.value];

    if (!stickerUrl) {
        console.error("Tipo di sticker non valido.");
        return;
    }

    const img = new Image();

    img.onload = function () {
        walletSticker = img;
        draw();
        console.log("Sticker caricato:", stickerUrl);
    };

    img.onerror = function () {
        console.error("Impossibile caricare:", stickerUrl);
        walletSticker = null;
        draw();
    };

    img.src = stickerUrl;
}

document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById("walletType");

    if (selector) {
        selector.addEventListener("change", loadWalletSticker);
        loadWalletSticker();
    }
});



function draw() {
  if (!source.complete || !source.naturalWidth) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);

  // Posizione e dimensioni del codice Aztec.
  const qx = 84;
  const qy = 468;
  const qs = 560;

  // Copre l'eventuale codice originale presente sullo sfondo.
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(qx, qy, qs, qs);

  // Disegna il codice Aztec generato dinamicamente.
if (qrImage && qrImage.complete && qrImage.naturalWidth > 0) {
  ctx.drawImage(qrImage, qx, qy, 566, 566);
}
// Sticker Wallet sotto il codice Aztec
if (
    walletSticker &&
    walletSticker.complete &&
    walletSticker.naturalWidth > 0
) {
    const stickerW = 1004;
    const stickerH = 170;

    const stickerX = qx + (873 - stickerW) / 2;
    const stickerY = qy + 610 + 20;

    ctx.drawImage(
        walletSticker,
        stickerX,
        stickerY,
        stickerW,
        stickerH
    );
}


 ctx.fillStyle='#eaca53';
 
ctx.textAlign = 'right';

let seat = $('seat').value.trim().toUpperCase();

if (seat !== '' && !/^\d{1,2}[A-F]?$/.test(seat)) {

// Disegna il posto formattato

$('download').addEventListener('click', async () => {
    try {

        // Campi obbligatori da compilare
        const requiredFields = [
            { id: 'name', label: 'Nome passeggero' },
            
            { id: 'originCode', label: 'Città di partenza' },
        
            { id: 'destCode', label: 'Città di destinazione' },
            { id: 'reference', label: 'Riferimento' },
            { id: 'sequence', label: 'Sequenza' },
            { id: 'seat', label: 'Posto assegnato' },
            { id: 'flightNumber', label: 'Numero del volo' },
            { id: 'departureTime', label: 'Orario di partenza' },
            { id: 'flightDate', label: 'Data del volo' },
            { id: 'staffname', label: 'Nome e cognome Staff' },
            { id: 'staffTitle', label: 'Titolo Staff' },
            { id: 'staffdate', label: 'Data assunzione Staff' }
        ];

        // Controlla i campi vuoti
        const missingFields = requiredFields.filter(field => {
            const element = $(field.id);
            return !element || !element.value.trim();
        });

        // Se mancano campi, mostra l'errore e interrompe
        if (missingFields.length > 0) {
            alert(
                'Impossibile scaricare la carta d’imbarco.\n\n' +
                'Compila tutti i campi obbligatori:\n\n' +
                missingFields.map(field => '• ' + field.label).join('\n')
            );
            return;
        }

        // Verifica che l'immagine di sfondo sia caricata
        if (!source.complete || !source.naturalWidth) {
            alert("L'immagine della carta d'imbarco non è ancora pronta.");
            return;
        }

        // Aggiorna il codice Aztec
        updateQR();

        // Attende il caricamento del codice
        if (qrImage && !qrImage.complete) {
            await new Promise((resolve, reject) => {
                qrImage.addEventListener('load', resolve, { once: true });
                qrImage.addEventListener('error', reject, { once: true });
            });
        }

        // Ridisegna la carta
        draw();

        // Esporta il canvas in PNG
        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(result => {
                if (result) {
                    resolve(result);
                } else {
                    reject(new Error("Impossibile esportare il canvas."));
                }
            }, 'image/png');
        });

        // Avvia il download
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = 'BoardingPassRYR.png';

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

    } catch (error) {
        console.error("Errore durante il download:", error);
        alert("Errore durante il download: " + error.message);
    }
});
